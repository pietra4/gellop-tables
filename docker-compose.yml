version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: clayite-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-clayite}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-clayite_dev_pass}
      POSTGRES_DB: ${POSTGRES_DB:-clayite}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clayite"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - clayite-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: clayite-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_URL: postgresql://${POSTGRES_USER:-clayite}:${POSTGRES_PASSWORD:-clayite_dev_pass}@postgres:5432/${POSTGRES_DB:-clayite}
      JWT_SECRET: ${JWT_SECRET:-dev_jwt_secret_change_in_production}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-24h}
      API_PORT: ${API_PORT:-3000}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
    ports:
      - "3000:3000"
    volumes:
      - ./backend/src:/app/src
      - ./backend/migrations:/app/migrations
    networks:
      - clayite-network
    command: npm run dev

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: clayite-frontend
    depends_on:
      - backend
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:3000}
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
    networks:
      - clayite-network
    command: npm run dev

volumes:
  postgres_data:

networks:
  clayite-network:
    driver: bridge
